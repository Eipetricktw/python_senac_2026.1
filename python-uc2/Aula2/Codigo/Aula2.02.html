<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Estrutura HTML5 com Bootstrap e Font Awesome</title>
    <meta name="description" 
        content="Uma página de exemplo para demonstrar a estrutura básica do HTML5 com Bootstrap e Font Awesome.">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
        rel="stylesheet">

    <!-- Font Awesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" 
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css"
        rel="stylesheet" >


    <!-- Estilos personalizados (opcional) -->
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            padding: 20px;
        }
    </style>
</head>
<body>    

    <section>
        <h1>Exemplo de uso de imagem</h1>

        <img src="img/paisagem.jpg"
            width="600" height="400"
            alt="Por do sol - Praia Grande - Arraial do Cabo"
            title="Por do sol - Praia Grande - Arraial do Cabo">
        
        <hr>
    </section> 

 <section>
        <h4>2ª imagem</h4>

        <figure>
            <img src="img/bird-8450958_1920.png" height="300px" 
            alt="Aqui tem uma Paisagem">
            <figcaption> Figura 1: Imagem de uma ave</figcaption>
        </figure>
        <hr>
    </section>


    <section>
        <h4>3ª imagem</h4>

        <figure>
            <img src="img/christmas-6805045_1920.jpg" height="300px" 
            alt="Aqui tem uma Paisagem">
            <figcaption> Figura 1: Imagem de um presente</figcaption>
        </figure>
        <hr>
    </section>

    <section>
        <h4>4ª imagem</h4>

        <figure>
            <img src="img/field-1728099_1920.jpg" height="300px" 
            alt="Aqui tem uma Paisagem">
            <figcaption> Figura 1: Imagem de um campo aberto</figcaption>
        </figure>
        <hr>
    </section>



    <section>
        <h4>5ª imagem</h4>

        <figure>
            <img src="img/bouquet-8627534_1920.jpg" height="300px" 
            alt="Aqui tem uma Paisagem">
            <figcaption> Figura 1: Imagem de um boque</figcaption>
        </figure>
        <hr>
    </section>


    <section>
        <h4>6ª imagem</h4>

        <figure>
            <img src="img/monstera-8165765_1920.jpg" height="300px" 
            alt="Aqui tem uma Paisagem">
            <figcaption> Figura 1: Imagem de um jarro de flor</figcaption>
        </figure>
        <hr>
    </section>


    <!-- Bootstrap JS e dependências -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">       
    </script>
</body>
</html>
