        <h1 class="text-center mb-4">Formulário de Cadastro</h1>
        <p class="text-center mb-4">Preencha os campos abaixo para criar sua conta.</p>

        <!-- Formulário de Cadastro -->
        <form action="cadastro/" method="get" target="_blank">

            <!-- Nome Completo -->
            <div class="input-group mb-3">
                <span class="input-group-text" id="addon-nome">Nome*</span>
                <input
                    type="text"
                    class="form-control"
                    name="nome"
                    required
                    placeholder="Insira seu nome"
                    aria-label="Nome"
                    aria-describedby="addon-nome"
                />
            </div>

            <!-- E-mail de login -->
            <div class="input-group mb-3">
                <span class="input-group-text" id="addon-email">
                    <i class="fa-light fa-at"></i> Email
                </span>
                <input
                    type="email"
                    class="form-control"
                    name="email"
                    placeholder="Email"
                    aria-label="Email"
                    aria-describedby="addon-email"
                />
            </div>

            <!-- Senha e Confirmar Senha -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label" for="senha">Senha:</label>
                    <input 
                        class="form-control" 
                        type="password" 
                        id="senha" 
                        name="senha" 
                        required 
                        minlength="6" 
                        placeholder="Informe uma senha"
                    />
                </div>

                <div class="col-md-6">
                    <label class="form-label" for="confirm_senha">Confirmar:</label>
                    <input 
                        class="form-control" 
                        type="password" 
                        id="confirm_senha" 
                        name="confirm_senha" 
                        required 
                        minlength="6" 
                        placeholder="Confirme a senha"
                    />
                </div>
            </div>

            <!-- Data de Nascimento e Sexo -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label" for="nascimento">Data Nascimento:</label>
                    <input class="form-control" type="date" id="nascimento" name="nascimento" />
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="sexo">Sexo:</label>
                    <select class="form-select" id="sexo" name="sexo" aria-label="Seleção de sexo">
                        <option selected disabled value="">Selecione uma opção</option>
                        <option value="1">Masculino</option>
                        <option value="2">Feminino</option>
                        <option value="3">Outro</option>
                    </select>
                </div>
            </div>

            <!-- CPF -->
            <div class="mb-3">
                <label class="form-label" for="cpf">CPF:</label>
                <input 
                    class="form-control" 
                    type="text" 
                    id="cpf" 
                    name="cpf" 
                    placeholder="000.000.000-00" 
                    pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" 
                    title="Formato: 000.000.000-00" 
                    required 
                />
            </div>

            <!-- Estado -->
            <div class="mb-3">
                <label class="form-label" for="estado">Estado:</label>
                <select class="form-select" id="estado" name="estado" aria-label="Seleção de estado">
                    <option selected disabled value="">Selecione o estado</option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>
            </div>

            <!-- Telefone -->
            <div class="mb-3">
                <label class="form-label" for="telefone">Telefone*:</label>
                <input 
                    class="form-control" 
                    type="tel" 
                    id="telefone" 
                    name="telefone" 
                    required 
                    placeholder="(XX) XXXXX-XXXX"
                    pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}"
                    title="Formato: (XX) XXXXX-XXXX"
                />
            </div>

            <!-- Botões -->
            <div class="row mt-4">
                <div class="col-6">
                    <button type="submit" class="w-100 btn btn-outline-primary">
                        Enviar
                    </button>
                </div>
                <div class="col-6">
                    <button type="reset" class="w-100 btn btn-outline-warning">
                        Limpar
                    </button>
                </div>
            </div>

        </form>
