<!DOCTYPE html>
<html lang="pt-BR">
<!-- Inicio do Head-->
<head>  
    <title>Eletronicos do Pet - Formulário de Cadastro</title>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <meta name="description" content="Formulário de Cadastro de clientes">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
        rel="stylesheet">

    <!-- Font Awesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" 
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">

    <style>
        .adicionar_borda {
           border-width: 1px;
           border-style: solid;
           border-color: black;            
        }
    </style>
</head>
<!-- Final do Head-->

<!-- Inicio do Body -->
<body class="bg-dark">
    <!-- 
        DIV - Principal
        Area principal do site contem o 
            - Header
            - Main 
            - Footer
    -->
    <div id="div_principal" class="container adicionar_borda bg-light my-4 p-4">
        
        <!-- Header da pagina -->
        <header class="adicionar_borda p-3 mb-3">
            <div class="row">
                <div class="col-12">
                    <h4>Logo / Titulo</h4>
                </div>
            </div>

            <div class="row mt-2">
                <div class="col-9">
                    Menu principal
                </div>
                <div class="col-3 text-end">
                    <i class="fa-solid fa-circle-user fa-xl"></i>
                    <i class="fa-solid fa-right-to-bracket fa-xl"></i>
                    <i class="fa-solid fa-right-from-bracket fa-xl"></i>
                    Login/Logout | Cadastrar 
                </div>
            </div>

            <!-- Cmç da Navbar -->
            <nav class="navbar navbar-dark bg-dark">                    
                    <div class="container-fluid">
                            <a class="navbar-brand" href="#">Navbar w/ text</a>
                            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                            </button>
                            <div class="collapse navbar-collapse" id="navbarText">
                                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                                    <li class="nav-item">
                                    <a class="nav-link active" aria-current="page" href="#">Home</a>
                                    </li>
                                    <li class="nav-item">
                                    <a class="nav-link" href="#">Loja</a>
                                    </li>
                                    <li class="nav-item">
                                    <a class="nav-link" href="#">Blog</a>
                                    </li>
                                </ul>

                    </div>
                </nav>
            <!-- Final Navbar -->
        </header>

        <!-- Main da pagina -->
        <main class="adicionar_borda p-3 mb-3">
            <!-- Formulário de Cadastro -->
            <form action="cadastro/" method="get" target="_blank">

                <!-- Nome Completo -->
                 <div class="input-group mb-3">
            <span class="input-group-text" id="addon-nome">Nome*</span>
            <input
              type="text"
              class="form-control"
              name="nome"
              required
              placeholder="Insira seu nome"
              aria-label="Nome"
              aria-describedby="addon-nome"
            />
          </div>

                <!-- E-mail de login -->
               <div class="input-group mb-3">
            <span class="input-group-text" id="addon-email"
              ><i class="fa-light fa-at"> Email</i></span
            >
            <!-- <span class="input-group-text" id="addon-email">@</span> -->
            <input
              type="email"
              class="form-control"
              name="email"
              placeholder="Email"
              aria-label="Email"
              aria-describedby="addon-email"
            />
          </div>

                <!-- Senha e Confirmar Senha -->
                <div class="row mb-3"> 
                    <div class="col-md-6">
                        <label class="form-label" for="senha">Senha:</label>
                        <input class="form-control" type="password" id="senha" name="senha" 
                            required minlength="6" placeholder="Informe uma senha">            
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="confirm_senha">Confirmar:</label>
                        <input class="form-control" type="password" id="confirm_senha" name="confirm_senha" 
                            required minlength="6" placeholder="Confirme a senha">
                    </div>
                </div>

                <!-- Data de Nascimento e Sexo -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label" for="nascimento">Data Nascimento:</label>
                        <input class="form-control" type="date" id="nascimento" name="nascimento">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="opcao">Sexo:</label>
                        <select class="form-select" id="opcao" aria-label="Default select example">
                            <option selected>Abrir o menu</option>
                            <option value="1">Masculino</option>
                            <option value="2">Feminino</option>
                            <option value="3">Outro</option>
                        </select>
                    </div>
                </div>

                <!-- CPF -->
                <div class="mb-3">
                    <label class="form-label" for="cpf">CPF:</label>
                    <input class="form-control" type="text" id="cpf" name="cpf" 
                        placeholder="000.000.000-00" 
                        pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" 
                        title="Formato: 000.000.000-00" required>             
                </div>


                <!-- Estado -->
                            <div class="mb-3">
                    <label class="form-label" for="opcao">Estado:</label>
                    <select class="form-select" id="opcao" aria-label="Default select example">
                        <option selected>Abrir o menu</option>
                        <option value="AC">Acre</option>
                        <option value="AL">Alagoas</option>
                        <option value="AP">Amapá</option>
                        <option value="AM">Amazonas</option>
                        <option value="BA">Bahia</option>
                        <option value="CE">Ceará</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="MA">Maranhão</option>
                        <option value="MT">Mato Grosso</option>
                        <option value="MS">Mato Grosso do Sul</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PA">Pará</option>
                        <option value="PB">Paraíba</option>
                        <option value="PR">Paraná</option>
                        <option value="PE">Pernambuco</option>
                        <option value="PI">Piauí</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="RO">Rondônia</option>
                        <option value="RR">Roraima</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="SE">Sergipe</option>
                        <option value="TO">Tocantins</option>
                    </select>
                </div>


                <!-- Telefone -->
                <div class="mb-3">
                    <label class="form-label" for="telefone">Telefone*:</label>
                    <input class="form-control" type="tel" id="telefone" name="telefone" 
                        required placeholder="(XX) XXXXX-XXXX"
                        pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}"
                        title="Formato: (XX) XXXXX-XXXX">
                </div>


                <!-- Curriculo -->
                <div>
                    <div class="mb-3">
                        <label for="formFile" class="form-label">Curriculo</label>
                        <input class="form-control" type="file" id="formFile">
                        </div>
                </div>

                <!-- Botões -->
                <div class="row mt-4">
                    <div class="col-6">
                        <button type="submit" class="form-control btn btn-outline-primary">
                            Enviar
                        </button>
                    </div>
                    <div class="col-6">
                        <button type="reset" class="form-control btn btn-outline-warning">
                            Limpar
                        </button>
                    </div>
                </div>

            </form>
            <!-- Final do Form -->
        </main>

        <!-- Footer da pagina -->
        <footer class="adicionar_borda p-3">
            <div class="row align-items-center">
                <div class="col-4">
                    Menu Secundário
                </div>

                <div class="col-5">
                    Contato <br>
                    Copyright &copy; 2026
                </div>

                <div class="col-3 text-end">
                    <a href="https://github.com/Eipetricktw" target="_blank" title="Acesse nosso GitHub" class="fs-5 text-dark">
                           <i class="fa-brands fa-github"></i>Github</a>
                </div>
            </div>
        </footer>
    </div> 
    <!-- Final da Div Principal-->   

    <!-- Bootstrap JS e dependências -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </script>
</body>
<!-- Final do Body-->
</html>
